<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ikkimizning o'yinlar</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>❤️ Ikkimizning o'yinlar</h1>
      <p class="sub">Sevgan insonim uchun</p>
    </header>

    <div id="toast" class="toast hidden"></div>

    <!-- Kirish -->
    <section id="lobby" class="card">
      <label>Ismingiz
        <input id="name" maxlength="20" placeholder="Ismingizni yozing" autocomplete="off">
      </label>
      <button id="createBtn" class="primary">🎮 Yangi xona ochish</button>
      <div class="or">yoki</div>
      <label>Xona kodi
        <input id="codeInput" maxlength="4" placeholder="ABCD" autocapitalize="characters" autocomplete="off">
      </label>
      <button id="joinBtn">🔑 Xonaga kirish</button>
    </section>

    <!-- Xona paneli -->
    <section id="room" class="hidden">
      <div id="roomBar" class="card bar"></div>
      <div id="waiting" class="card hidden"></div>
      <div id="menu" class="card hidden"></div>
      <div id="rps" class="card hidden"></div>
      <div id="cards" class="card hidden"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
